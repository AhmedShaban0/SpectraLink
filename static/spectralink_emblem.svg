<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="emb-orbit-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="emb-orbit-orange" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="emb-earth" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="60%" stop-color="#072b44"/>
      <stop offset="100%" stop-color="#03101c"/>
    </radialGradient>
    <radialGradient id="emb-star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="emb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(60, 60)">
    <circle r="56" fill="#040714"/>
    <circle r="55" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.4"/>
    <circle r="52" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8" stroke-dasharray="2 4"/>
    <g stroke="rgba(56, 189, 248, 0.75)" stroke-width="1.6">
      <line x1="0" y1="-55" x2="0" y2="-49"/>
      <line x1="0" y1="55" x2="0" y2="49"/>
      <line x1="-55" y1="0" x2="-49" y2="0"/>
      <line x1="56" y1="0" x2="49" y2="0"/>
    </g>
    <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" 
             fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle r="28" fill="url(#emb-earth)" stroke="rgba(56, 189, 248, 0.7)" stroke-width="1.4"/>
    <path d="M -15 -13 Q -10 -19 -4 -18 Q 2 -17 7 -12 Q 13 -10 16 -3 Q 15 7 8 12 Q 2 16 -7 15 Q -13 13 -16 4 Z" 
          fill="rgba(56, 189, 248, 0.18)"/>
    <ellipse rx="28" ry="7" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8"/>
    <ellipse rx="9" ry="28" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8"/>
    <g transform="rotate(-35)">
      <ellipse rx="48" ry="18" fill="none" stroke="url(#emb-orbit-cyan)" stroke-width="2.6" stroke-dasharray="135 18" filter="url(#emb-glow)"/>
      <circle cx="-43" cy="7.5" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
    </g>
    <g transform="rotate(35)">
      <ellipse rx="48" ry="18" fill="none" stroke="url(#emb-orbit-orange)" stroke-width="2.6" stroke-dasharray="135 18" filter="url(#emb-glow)"/>
      <circle cx="43" cy="-7.5" r="3.5" fill="#f97316" stroke="#fef08a" stroke-width="1.2"/>
    </g>
    <g transform="translate(0, -29)">
      <circle r="8" fill="url(#emb-star-glow)"/>
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#ffffff"/>
      <circle r="2.2" fill="#fef08a"/>
